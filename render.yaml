services:
  # -------------------------------------------------------------
  # 1. Nexus OS - Spring Boot API Service
  # -------------------------------------------------------------
  - type: web
    name: nexusos-api
    env: java
    rootDir: apps/api
    region: singapore
    plan: free
    buildCommand: chmod +x ./gradlew && ./gradlew bootJar --no-daemon -Dorg.gradle.jvmargs="-Xmx384m"
    startCommand: java -jar build/libs/nexus-os-api-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: POSTGRES_URL
        fromDatabase:
          name: nexusos-db
          property: connectionString
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: NEXUSOS_JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Nexus OS - Hocuspocus Collaboration WebSocket Service
  # -------------------------------------------------------------
  - type: web
    name: nexusos-hocuspocus
    env: node
    region: singapore
    plan: free
    buildCommand: npm install @hocuspocus/server @hocuspocus/extension-database yjs
    startCommand: node hocuspocus.server.js
    envVars:
      - key: PORT
        value: 1234
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: nexusos-api
          property: host
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: nexusos-api
          envVarKey: INTERNAL_API_SECRET

  # -------------------------------------------------------------
  # 3. Nexus OS - Next.js Web Frontend
  # -------------------------------------------------------------
  - type: web
    name: nexusos-web
    env: node
    rootDir: apps/web
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nexusos-api
          property: host
      - key: NEXT_PUBLIC_HOCUSPOCUS_URL
        fromService:
          type: web
          name: nexusos-hocuspocus
          property: host

databases:
  - name: nexusos-db
    databaseName: nexus_os
    user: nexus
    region: singapore
    plan: free
