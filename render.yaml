services:
  # -------------------------------------------------------------
  # 1. Nexus OS - Spring Boot API Service
  # -------------------------------------------------------------
  - type: web
    name: nexusos-api
    env: docker
    dockerfilePath: Dockerfile.api
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Nexus OS - Next.js Web Frontend
  # -------------------------------------------------------------
  - type: web
    name: nexusos-web
    env: node
    region: singapore
    plan: free
    buildCommand: cd apps/web && npm install && npm run build
    startCommand: cd apps/web && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nexusos-api
          property: host
